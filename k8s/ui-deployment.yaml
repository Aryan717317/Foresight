apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-ui
  namespace: app
  labels:
    app: demo-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-ui
  template:
    metadata:
      labels:
        app: demo-ui
    spec:
      containers:
        - name: demo-ui
          image: your-dockerhub-username/self-healing-eks-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          env:
            - name: API_URL
              value: "http://demo-app-service.app.svc.cluster.local:80"
