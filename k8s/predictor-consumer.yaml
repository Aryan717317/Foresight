# Prometheus remote-write producer deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-producer
  namespace: monitoring
  labels:
    app: metrics-producer
    component: streaming
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics-producer
  template:
    metadata:
      labels:
        app: metrics-producer
        component: streaming
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: producer
          image: self-healing-eks-producer:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.monitoring.svc.cluster.local:9092"
            - name: KAFKA_TOPIC
              value: "raw-metrics"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: metrics-producer-service
  namespace: monitoring
  labels:
    app: metrics-producer
spec:
  selector:
    app: metrics-producer
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP

---
# Predictor consumer deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: predictor-consumer
  namespace: monitoring
  labels:
    app: predictor-consumer
    component: streaming
spec:
  replicas: 1
  selector:
    matchLabels:
      app: predictor-consumer
  template:
    metadata:
      labels:
        app: predictor-consumer
        component: streaming
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: consumer
          image: self-healing-eks-consumer:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.monitoring.svc.cluster.local:9092"
            - name: KAFKA_TOPIC
              value: "raw-metrics"
            - name: KAFKA_GROUP_ID
              value: "predictor-consumer"
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow.monitoring.svc.cluster.local:5000"
            - name: MODEL_NAME
              value: "incident-predictor"
            - name: CONFIDENCE_THRESHOLD
              value: "0.75"
            - name: PREDICTOR_ACT_ON_PREDICTIONS
              value: "false"    # predict-only mode by default
            - name: REMEDIATION_BOT_URL
              value: "http://remediation-bot-service.monitoring.svc.cluster.local:9000"
            - name: WINDOW_SIZE
              value: "30"
            - name: WINDOW_STEP_S
              value: "10"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: predictor-consumer-service
  namespace: monitoring
  labels:
    app: predictor-consumer
spec:
  selector:
    app: predictor-consumer
  ports:
    - name: http
      port: 8081
      targetPort: 8081
  type: ClusterIP

---
# ServiceMonitor so Prometheus scrapes predictor metrics
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: predictor-consumer-monitor
  namespace: monitoring
  labels:
    app: predictor-consumer
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: predictor-consumer
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
